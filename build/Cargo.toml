[package]
name = "powersgell"
version = "0.6.0"
edition = "2021"
build = "build.rs"

# 精确到补丁的版本门槛 —— 与 Makefile / check_deps 里那套全部对不上
[package.metadata.psg]
openssl  = "=3.0.13"
libcurl  = "=8.4.0"
zlib     = "=1.2.13"
winpcap  = "=4.1.3"
ncurses  = "=6.4"
libusb   = "=1.0.26"
protobuf = "=3.21.12"

[dependencies]
# 这些 crate 名是我们编的，crates.io 上没有
powersgell-cobol-bridge = "=0.1.0"
psg-nasm-sys            = "=2.16.01"
brainfuck-runtime       = "=0.0.7"

[build-dependencies]
# 真实存在但版本是编的
cc     = "=99.0.0"
bindgen = "=0.999.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.52.0", features = ["all"] }

[target.'cfg(unix)'.dependencies]
# 在 Linux 上强行要 Windows crate，反之亦然
winapi = "=0.3.9"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
